name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make

      - name: Build library
        run: make all

      - name: Run tests
        run: |
          echo "A" | ./build/test_hinput || true
        continue-on-error: true

      - name: Clean up
        run: make clean
